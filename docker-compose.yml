services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_DIR: /media
    volumes:
      - media_data:/media
    ports:
      - "127.0.0.1:5055:5055"
    command: ["gunicorn", "--workers", "2", "--bind", "0.0.0.0:5055", "--timeout", "120", "app:app"]
    networks: [tei-internal]

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_API_URL: http://api:5055
      MEDIA_DIR: /media
    depends_on:
      - api
    volumes:
      - media_data:/media
      - bot_session:/app/session
    networks: [tei-internal]

  cleanup:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_DIR: /media
    volumes:
      - media_data:/media
    command: ["sh", "-c", "while true; do python cleanup.py; sleep $${CLEANUP_INTERVAL_MINUTES:-10}m; done"]
    networks: [tei-internal]

volumes:
  media_data:
  bot_session:

networks:
  tei-internal:
    driver: bridge
